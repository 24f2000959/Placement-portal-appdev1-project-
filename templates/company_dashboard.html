<!DOCTYPE html>
<html>
<head>
<title>Company Dashboard</title>
</head>

<body>

<h1>Company Dashboard</h1>

<a href="/create_drive">Create Drive</a>

<br><br>

<a href="/logout">Logout</a>

<h2>Your Drives</h2>

<table border="1">

<tr>
<th>ID</th>
<th>Role</th>
<th>Package</th>
<th>Deadline</th>
</tr>

{% for drive in drives %}

<tr>
<td>{{ drive.id }}</td>
<td>{{ drive.role }}</td>
<td>{{ drive.package }}</td>
<td>{{ drive.deadline }}</td>
</tr>

{% endfor %}

</table>

</body>
</html>
